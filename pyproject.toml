[project]
name = "shopkeeper-brain"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "doclayout-yolo>=0.0.4",
    "fastapi>=0.136.3",
    "flagembedding>=1.3.5",
    "grandalf>=0.8",
    "ipykernel>=7.2.0",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.2.2",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.2.2",
    "loguru>=0.7.3",
    "mineru>=3.2.1",
    "minio>=7.2.20",
    "modelscope>=1.37.1",
    "neo4j>=6.2.0",
    "numpy>=2,<2.3.0",
    "openai-agents>=0.17.4",
    "opencv-python>=4.11.0.86",
    "paddlepaddle>=3.3.1",
    "pycocotools>=2.0.11",
    "pydantic>=2.13.4",
    "pymilvus[model]>=3.0.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.5.1",
    "torch==2.8.0+cu128",
    "torchvision==0.23.0+cu128",
    "ultralytics>=8.4.57",
    "uvicorn>=0.48.0",
]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
